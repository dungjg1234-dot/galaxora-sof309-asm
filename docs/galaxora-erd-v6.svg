<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-label="ERD phần quản lý nhiệm vụ Flyway V6">
  <rect width="1440" height="580" fill="#fff" />
  <text x="44" y="57" fill="#000" font-family="Segoe UI" font-size="27" font-weight="700">Quản lý nhiệm vụ · Flyway V6</text>
  <line x1="219" y1="166" x2="219" y2="310" stroke="#000" />
  <text x="225" y="184" fill="#000" font-family="Consolas, monospace" font-size="12" font-weight="400">1</text>
  <text x="225" y="303" fill="#000" font-family="Consolas, monospace" font-size="12" font-weight="400">0..N</text>
  <line x1="520" y1="343" x2="394" y2="343" stroke="#000" />
  <text x="502" y="337" fill="#000" font-family="Consolas, monospace" font-size="12" font-weight="400">1</text>
  <text x="400" y="337" fill="#000" font-family="Consolas, monospace" font-size="12" font-weight="400">0..N</text>
  <line x1="870" y1="343" x2="995" y2="343" stroke="#000" />
  <text x="875" y="337" fill="#000" font-family="Consolas, monospace" font-size="12" font-weight="400">1</text>
  <text x="955" y="337" fill="#000" font-family="Consolas, monospace" font-size="12" font-weight="400">0..1</text>
  <g id="v6-nguoi_dung">
    <rect x="44" y="100" width="350" height="66" fill="#fff" stroke="#000" />
    <line x1="44" x2="394" y1="135" y2="135" stroke="#000" />
    <text x="56" y="124" fill="#000" font-family="Consolas, monospace" font-size="17" font-weight="700">nguoi_dung (tham chiếu)</text>
    <g id="v6-col-nguoi_dung-id">
      <title>id BIGINT NOT NULL PRIMARY KEY</title>
      <text x="54" y="155" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700">PK</text>
      <text x="111" y="155" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">id</text>
      <text x="269" y="155" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">BIGINT</text>
    </g>
  </g>
  <g id="v6-nhiem_vu">
    <rect x="520" y="260" width="350" height="274" fill="#fff" stroke="#000" />
    <line x1="520" x2="870" y1="295" y2="295" stroke="#000" />
    <text x="532" y="284" fill="#000" font-family="Consolas, monospace" font-size="17" font-weight="700">nhiem_vu</text>
    <g id="v6-col-nhiem_vu-id">
      <title>id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY</title>
      <text x="530" y="315" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700">PK</text>
      <text x="587" y="315" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">id</text>
      <text x="745" y="315" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">BIGINT</text>
    </g>
    <g id="v6-col-nhiem_vu-ten">
      <title>ten VARCHAR(160) NOT NULL</title>
      <text x="530" y="341" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="587" y="341" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">ten</text>
      <text x="745" y="341" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">VARCHAR(160)</text>
    </g>
    <g id="v6-col-nhiem_vu-mo_ta">
      <title>mo_ta VARCHAR(1000) NOT NULL</title>
      <text x="530" y="367" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="587" y="367" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">mo_ta</text>
      <text x="745" y="367" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">VARCHAR(1000)</text>
    </g>
    <g id="v6-col-nhiem_vu-loai_dieu_kien">
      <title>loai_dieu_kien VARCHAR(16) NOT NULL</title>
      <text x="530" y="393" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="587" y="393" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">loai_dieu_kien</text>
      <text x="745" y="393" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">VARCHAR(16)</text>
    </g>
    <g id="v6-col-nhiem_vu-ma_dieu_kien">
      <title>ma_dieu_kien VARCHAR(48)</title>
      <text x="530" y="419" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="587" y="419" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">ma_dieu_kien</text>
      <text x="745" y="419" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">VARCHAR(48)</text>
    </g>
    <g id="v6-col-nhiem_vu-xp">
      <title>xp INT NOT NULL CHECK (xp &gt;= 0)</title>
      <text x="530" y="445" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="587" y="445" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">xp</text>
      <text x="745" y="445" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">INT</text>
    </g>
    <g id="v6-col-nhiem_vu-ten_huy_hieu">
      <title>ten_huy_hieu VARCHAR(160)</title>
      <text x="530" y="471" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="587" y="471" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">ten_huy_hieu</text>
      <text x="745" y="471" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">VARCHAR(160)</text>
    </g>
    <g id="v6-col-nhiem_vu-co_voucher">
      <title>co_voucher BOOLEAN NOT NULL</title>
      <text x="530" y="497" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="587" y="497" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">co_voucher</text>
      <text x="745" y="497" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">BOOLEAN</text>
    </g>
    <g id="v6-col-nhiem_vu-kich_hoat">
      <title>kich_hoat BOOLEAN NOT NULL</title>
      <text x="530" y="523" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="587" y="523" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">kich_hoat</text>
      <text x="745" y="523" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">BOOLEAN</text>
    </g>
  </g>
  <g id="v6-nhiem_vu_hoan_thanh">
    <rect x="44" y="310" width="350" height="118" fill="#fff" stroke="#000" />
    <line x1="44" x2="394" y1="345" y2="345" stroke="#000" />
    <text x="56" y="334" fill="#000" font-family="Consolas, monospace" font-size="17" font-weight="700">nhiem_vu_hoan_thanh</text>
    <g id="v6-col-nhiem_vu_hoan_thanh-nguoi_dung_id">
      <title>nguoi_dung_id BIGINT NOT NULL FK → nguoi_dung(id)</title>
      <text x="54" y="365" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700">PK/FK</text>
      <text x="111" y="365" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">nguoi_dung_id</text>
      <text x="269" y="365" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">BIGINT</text>
    </g>
    <g id="v6-col-nhiem_vu_hoan_thanh-nhiem_vu_id">
      <title>nhiem_vu_id BIGINT NOT NULL FK → nhiem_vu(id)</title>
      <text x="54" y="391" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700">PK/FK</text>
      <text x="111" y="391" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">nhiem_vu_id</text>
      <text x="269" y="391" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">BIGINT</text>
    </g>
    <g id="v6-col-nhiem_vu_hoan_thanh-hoan_thanh_luc">
      <title>hoan_thanh_luc DATETIME(6) NOT NULL DEFAULT (UTC_TIMESTAMP(6))</title>
      <text x="54" y="417" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="111" y="417" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">hoan_thanh_luc</text>
      <text x="269" y="417" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">DATETIME(6)</text>
    </g>
  </g>
  <g id="v6-cau_hinh_voucher_nhiem_vu">
    <rect x="995" y="260" width="400" height="300" fill="#fff" stroke="#000" />
    <line x1="995" x2="1395" y1="295" y2="295" stroke="#000" />
    <text x="1007" y="284" fill="#000" font-family="Consolas, monospace" font-size="17" font-weight="700">cau_hinh_voucher_nhiem_vu</text>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-id">
      <title>id BIGINT NOT NULL PRIMARY KEY FK → nhiem_vu(id)</title>
      <text x="1005" y="315" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700">PK/FK</text>
      <text x="1062" y="315" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">id</text>
      <text x="1270" y="315" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">BIGINT</text>
    </g>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-loai">
      <title>loai VARCHAR(12) NOT NULL CHECK (loai IN ('PHAN_TRAM','SO_TIEN'))</title>
      <text x="1005" y="341" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="1062" y="341" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">loai</text>
      <text x="1270" y="341" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">VARCHAR(12)</text>
    </g>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-gia_tri">
      <title>gia_tri DECIMAL(15,2) NOT NULL CHECK (gia_tri &gt; 0)</title>
      <text x="1005" y="367" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="1062" y="367" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">gia_tri</text>
      <text x="1270" y="367" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">DECIMAL(15,2)</text>
    </g>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-giam_toi_da">
      <title>giam_toi_da DECIMAL(15,2) CHECK (giam_toi_da &gt;= 0)</title>
      <text x="1005" y="393" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="1062" y="393" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">giam_toi_da</text>
      <text x="1270" y="393" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">DECIMAL(15,2)</text>
    </g>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-don_toi_thieu">
      <title>don_toi_thieu DECIMAL(15,2) CHECK (don_toi_thieu &gt;= 0)</title>
      <text x="1005" y="419" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="1062" y="419" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">don_toi_thieu</text>
      <text x="1270" y="419" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">DECIMAL(15,2)</text>
    </g>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-bat_dau">
      <title>bat_dau DATETIME(6) NOT NULL</title>
      <text x="1005" y="445" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="1062" y="445" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">bat_dau</text>
      <text x="1270" y="445" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">DATETIME(6)</text>
    </g>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-ket_thuc">
      <title>ket_thuc DATETIME(6) NOT NULL</title>
      <text x="1005" y="471" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="1062" y="471" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">ket_thuc</text>
      <text x="1270" y="471" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">DATETIME(6)</text>
    </g>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-luot_toi_da">
      <title>luot_toi_da INT NOT NULL</title>
      <text x="1005" y="497" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="1062" y="497" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">luot_toi_da</text>
      <text x="1270" y="497" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">INT</text>
    </g>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-luot_da_cap">
      <title>luot_da_cap INT NOT NULL DEFAULT 0</title>
      <text x="1005" y="523" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="1062" y="523" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">luot_da_cap</text>
      <text x="1270" y="523" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">INT</text>
    </g>
    <g id="v6-col-cau_hinh_voucher_nhiem_vu-kich_hoat">
      <title>kich_hoat BOOLEAN NOT NULL</title>
      <text x="1005" y="549" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="700" />
      <text x="1062" y="549" fill="#000" font-family="Consolas, monospace" font-size="14" font-weight="400">kich_hoat</text>
      <text x="1270" y="549" fill="#000" font-family="Consolas, monospace" font-size="13" font-weight="400">BOOLEAN</text>
    </g>
  </g>
</svg>