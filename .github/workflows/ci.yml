name: GALAXORA CI

# Y5: Tự động chạy JUnit 5 + Selenium (nhóm smoke) khi push / pull_request;
# hỗ trợ chạy tay (workflow_dispatch) chọn nhóm smoke hoặc all; luôn upload báo cáo lên Artifacts.
on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      group:
        description: "Nhóm Selenium cần chạy: smoke (nhanh) hoặc all (đầy đủ)"
        required: true
        default: smoke
        type: choice
        options: [ smoke, all ]

env:
  DB_TEST_NAME: galaxora_test_asm
  DB_UI_NAME: galaxora_test_ui
  DB_USER: galaxora
  DB_PASSWORD: ci-only-password
  DEMO_ADMIN_EMAIL: admin-ui@galaxora.test
  DEMO_ADMIN_PASSWORD: AdminUiTest@2026
  DEMO_USER_EMAIL: user-ui@galaxora.test
  DEMO_USER_PASSWORD: UserUiTest@2026

jobs:
  # Job 1: Toàn bộ JUnit 5 (Unit Mockito + MockMvc + hồi quy tích hợp) trên MySQL 8.4 thật (không dùng H2).
  junit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: galaxora_test_asm
          MYSQL_USER: galaxora
          MYSQL_PASSWORD: ci-only-password
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Chạy toàn bộ bộ kiểm thử JUnit 5 trên MySQL 8.4
        working-directory: backend
        env:
          GALAXORA_DB_TEST_URL: jdbc:mysql://127.0.0.1:3306/galaxora_test_asm
          GALAXORA_DB_TEST_USER: galaxora
          GALAXORA_DB_TEST_PASSWORD: ci-only-password
          GALAXORA_DB_PASSWORD: ci-only-password
        run: mvn -B -ntp test

      - name: Upload báo cáo JUnit (Surefire) lên Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-surefire-report
          path: backend/target/surefire-reports/
          if-no-files-found: warn

  # Job 2: Selenium WebDriver + TestNG (POM). Dựng Backend Spring Boot + Frontend Vite trên MySQL 8.4 và chạy Chrome headless.
  selenium:
    runs-on: ubuntu-latest
    needs: junit
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: galaxora_test_ui
          MYSQL_USER: galaxora
          MYSQL_PASSWORD: ci-only-password
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Đóng gói Backend JAR (bỏ qua test vì đã kiểm chứng ở job junit)
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Cài đặt thư viện Frontend
        working-directory: frontend
        run: npm ci

      - name: Khởi động Backend ở cổng 8081 và chờ API sức khỏe sẵn sàng
        working-directory: backend
        env:
          GALAXORA_DB_URL: jdbc:mysql://127.0.0.1:3306/galaxora_test_ui?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
          GALAXORA_DB_USER: galaxora
          GALAXORA_DB_PASSWORD: ci-only-password
        run: |
          nohup java -jar target/galaxora-backend-0.0.1-SNAPSHOT.jar --server.port=8081 > backend-ci.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:8081/api/he-thong/suc-khoe | grep -q HOAT_DONG && echo "Backend sẵn sàng sau $i lần thử" && exit 0
            sleep 2
          done
          echo "Backend không khởi động được"; tail -50 backend-ci.log; exit 1

      - name: Tạo tài khoản kiểm thử USER và ADMIN qua API + cấp quyền ADMIN trên galaxora_test_ui
        run: |
          CSRF_JSON=$(curl -fs -c cookies.txt http://127.0.0.1:8081/api/tai-khoan/csrf)
          TOKEN=$(echo "$CSRF_JSON" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).token)")
          curl -fs -b cookies.txt -X POST http://127.0.0.1:8081/api/tai-khoan/dang-ky \
            -H "Content-Type: application/json" -H "X-CSRF-TOKEN: $TOKEN" \
            -d "{\"hoTen\":\"Admin UI CI\",\"email\":\"$DEMO_ADMIN_EMAIL\",\"soDienThoai\":\"+84901111111\",\"matKhau\":\"$DEMO_ADMIN_PASSWORD\"}"
          curl -fs -b cookies.txt -X POST http://127.0.0.1:8081/api/tai-khoan/dang-ky \
            -H "Content-Type: application/json" -H "X-CSRF-TOKEN: $TOKEN" \
            -d "{\"hoTen\":\"User UI CI\",\"email\":\"$DEMO_USER_EMAIL\",\"soDienThoai\":\"+84902222222\",\"matKhau\":\"$DEMO_USER_PASSWORD\"}"
          mysql -h 127.0.0.1 -P 3306 -u root -proot-ci galaxora_test_ui -e "
            INSERT IGNORE INTO nguoi_dung_vai_tro (nguoi_dung_id, vai_tro_id)
            SELECT n.id, v.id FROM nguoi_dung n JOIN vai_tro v ON v.ma='ADMIN'
            WHERE n.email_chuan_hoa='$DEMO_ADMIN_EMAIL';
          "

      - name: Khởi động Frontend Vite ở cổng 5173 (proxy /api -> 8081)
        working-directory: frontend
        env:
          GALAXORA_BACKEND_URL: http://127.0.0.1:8081
        run: |
          nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > frontend-ci.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fs http://127.0.0.1:5173/api/he-thong/suc-khoe | grep -q HOAT_DONG && echo "Frontend sẵn sàng sau $i lần thử" && exit 0
            sleep 2
          done
          echo "Frontend không khởi động được"; tail -50 frontend-ci.log; exit 1

      - name: Chạy Selenium + TestNG (mặc định nhóm smoke; chọn all khi chạy tay)
        working-directory: backend
        run: |
          PROFILE=smoke
          if [ "${{ github.event.inputs.group }}" = "all" ]; then PROFILE=ui; fi
          mvn -B -ntp test -P$PROFILE \
            -Dbase.url=http://127.0.0.1:5173 \
            -Dadmin.email="$DEMO_ADMIN_EMAIL" \
            -Dadmin.password="$DEMO_ADMIN_PASSWORD" \
            -Duser.email="$DEMO_USER_EMAIL" \
            -Duser.password="$DEMO_USER_PASSWORD" \
            -Dheadless=true

      - name: Upload báo cáo TestNG, ảnh chụp lỗi và log lên Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-testng-report
          path: |
            backend/target/surefire-reports/
            backend/target/screenshots/
            backend/backend-ci.log
            frontend/frontend-ci.log
          if-no-files-found: warn
